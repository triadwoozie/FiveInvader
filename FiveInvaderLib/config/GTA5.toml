# =============================================================================
# FiveInvader - GTA V Xbox 360 Static Recompilation Configuration
# Core XenonRecomp configuration targeting GTA V Xbox 360 default.xex
# =============================================================================

[main]
# Path to the decrypted/decompressed GTA V Xbox 360 executable
file_path = "../private/default.xex"

# Target directory where recompiled C++ PPC sources will be generated
out_directory_path = "../ppc"

# Path to the indirect switch jump tables definition file
switch_table_file_path = "./GTA5_switch_tables.toml"

# =============================================================================
# Local Variable & Register Optimizations
# =============================================================================
# Enable local variable allocation for transient PowerPC registers.
# These optimizations reduce memory traffic to the CPU Context structure
# and allow LLVM/Clang to perform aggressive register allocation in native code.

skip_lr = true               # Elide link register context writes when safe
skip_msr = true              # Elide machine state register context synchronization
ctr_as_local = true          # Allocate CTR (count register) as a local C++ variable
cr_as_local = true           # Allocate CR (condition register fields) as local variables

# Advanced register flags (keep false during initial bringup to avoid spill bugs)
xer_as_local = false         # Fixed-point exception register as local
reserved_as_local = false    # Reserved architectural registers
non_argument_as_local = false
non_volatile_as_local = false

# =============================================================================
# Recompiler Performance & Memory Tuning (for Large Executables)
# =============================================================================
# GTA V default.xex has >26MB decompressed .text; balanced chunking is required
verbose = true                       # Output progress notifications
progress_every = 500                 # Log progress every 500 recompiled functions
skip_auto_discovery = false          # Scan .pdata and branch targets
cpp_chunk_functions = 128            # Number of functions emitted per .cpp chunk
disable_identical_file_check = true  # Bypass file diffing to conserve host RAM
use_lightweight_analysis = true      # Minimize AST footprint during translation
max_functions_in_memory = 500        # Memory cap during analysis passes

# =============================================================================
# Register Save/Restore Helper Addresses (GTA V Xbox 360)
# =============================================================================
# Found by scanning the GTA V default.xex (title 545408A7) for XenonRecomp's
# documented byte patterns
restgprlr_14_address = 0x83622940
savegprlr_14_address = 0x836228F0
restfpr_14_address   = 0x83622D6C
savefpr_14_address   = 0x83622D20
restvmx_14_address   = 0x83623128
savevmx_14_address   = 0x83622E90
restvmx_64_address   = 0x836231BC
savevmx_64_address   = 0x83622F24

# longjmp / setjmp handlers (if utilized by the guest runtime)
# longjmp_address = 0x00000000
# setjmp_address  = 0x00000000

# =============================================================================
# Explicit Function Boundary Overrides
# =============================================================================
# Functions containing complex control flow, tail-call optimizations, or shared
# loop bodies where XenonAnalyse cannot determine function boundaries automatically.
# Format: { address = <virtual_address>, size = <byte_size> }
functions = [
    # Jump-table case blocks misdetected as separate functions
    { address = 0x825857A0, size = 0x98 }, # Covers 0x825857A0 to 0x82585838
]

# =============================================================================
# Invalid Instruction Patterns
# =============================================================================
# Byte patterns and padding sequences to treat as no-ops or skip during recompilation.
invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Zero-fill padding (nop / alignment)
]

# =============================================================================
# Mid-Assembly Hooks
# =============================================================================
# Define hooks that intercept execution at specific assembly instructions
# before or within functions without replacing the entire routine.
#
# Schema:
# [[midasm_hook]]
# name = "HookFunctionName"
# address = 0x82XXXXXX
# registers = ["r3", "r4", "r5"]
#
# Example (MSAA Level override):
# [[midasm_hook]]
# name = "GTA5_SetMSAALevel"
# address = 0x82607CD4
# registers = ["r4"]
